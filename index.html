<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Euzebio AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .app {
      max-width: 800px;
      height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      background: #075e54;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      margin-left: auto;
      background: #dcf8c6;
      border-bottom-right-radius: 3px;
    }

    .ai {
      margin-right: auto;
      background: #eeeeee;
      border-bottom-left-radius: 3px;
    }

    .system {
      margin: 10px auto;
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    #message {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 25px;
      padding: 0 20px;
      background: #075e54;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🤖 Euzebio AI</h1>
    <p>AI Assistant • Connected to Render Backend</p>
  </header>

  <div id="chat">
    <div class="system">
      Euzebio AI iriteguye. Andika ubutumwa hasi.
    </div>
  </div>

  <div class="input-area">
    <input
      id="message"
      type="text"
      placeholder="Andika ubutumwa..."
      autocomplete="off"
    >

    <button id="sendBtn">Ohereza</button>
  </div>

</div>

<script>

  // Euzebio AI Render Backend
  const BACKEND_URL =
    "https://euzebio-ai-backend.onrender.com";

  const chat = document.getElementById("chat");
  const messageInput = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");

  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageInput.value = "";

    sendBtn.disabled = true;
    sendBtn.textContent = "…";

    addMessage("Euzebio AI iratekereza...", "ai");

    try {

      const response = await fetch(
        BACKEND_URL + "/chat",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })
        }
      );

      const data = await response.json();

      // Remove thinking message
      const aiMessages =
        document.querySelectorAll(".message.ai");

      if (aiMessages.length > 0) {
        aiMessages[aiMessages.length - 1].remove();
      }

      if (data.reply) {

        addMessage(data.reply, "ai");

      } else if (data.message) {

        addMessage(data.message, "ai");

      } else {

        addMessage(
          "Euzebio AI yabonye ikibazo mu gusubiza.",
          "ai"
        );
      }

    } catch (error) {

      const aiMessages =
        document.querySelectorAll(".message.ai");

      if (aiMessages.length > 0) {
        aiMessages[aiMessages.length - 1].remove();
      }

      addMessage(
        "Ntibyashobotse guhuza na Euzebio AI backend. Reba internet cyangwa Render.",
        "ai"
      );

      console.error(error);

    } finally {

      sendBtn.disabled = false;
      sendBtn.textContent = "Ohereza";

      messageInput.focus();
    }
  }

  sendBtn.addEventListener(
    "click",
    sendMessage
  );

  messageInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    }
  );

</script>

</body>
</html>
